name: makan_mana
description: MakanMana - AI food recommendation app untuk Malaysia.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  cloud_functions: any
  firebase_storage: any
  firebase_analytics: any
  firebase_crashlytics: any
  firebase_messaging: any
  flutter_riverpod: ^2.6.1
  go_router: any
  geolocator: any
  intl: any
  cached_network_image: any
  lottie: any
  google_sign_in: any
  url_launcher: any
  shared_preferences: any
  share_plus: ^13.2.0
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
