name: QA Registry Search Device Build

on:
  push:
    branches:
      - qa/registry-search-device-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-apk:
    name: Build QA APK artifact
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout merged registry baseline
        uses: actions/checkout@v4
      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run registry/search/detail regression tests
        run: |
          flutter test test/explore_pagination_controller_test.dart
          flutter test test/explore_redesign_test.dart
          flutter test test/merchant_restaurant_profile_v2_test.dart
      - name: Build QA debug APK
        run: flutter build apk --debug --flavor qa
      - name: Create checksum
        run: sha256sum build/app/outputs/flutter-apk/app-qa-debug.apk > build/app/outputs/flutter-apk/app-qa-debug.apk.sha256
      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: makan-mana-qa-registry-search-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-qa-debug.apk
            build/app/outputs/flutter-apk/app-qa-debug.apk.sha256
          if-no-files-found: error
          retention-days: 3
