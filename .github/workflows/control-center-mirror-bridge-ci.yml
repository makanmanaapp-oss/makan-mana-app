name: Control Center Mirror Bridge CI

on:
  push:
    branches:
      - control-center/read-mirror-bridge
  pull_request:
    branches:
      - place-data/a0-backend-source-custody

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build all Cloud Functions
        run: npm run build

      - name: Run full Functions unit suite
        run: npm test
