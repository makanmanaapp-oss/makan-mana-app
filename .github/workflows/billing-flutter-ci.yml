name: Billing Flutter CI

on:
  pull_request:
    branches:
      - place-data/a0-backend-source-custody
    paths:
      - "lib/core/services/purchase_service.dart"
      - "lib/core/services/mock_purchase_service.dart"
      - "lib/repositories/user_repository.dart"
      - "lib/features/paywall/paywall_screen.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/billing-flutter-ci.yml"

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format billing Dart in CI checkout
        run: |
          dart format \
            lib/core/services/purchase_service.dart \
            lib/core/services/mock_purchase_service.dart \
            lib/repositories/user_repository.dart \
            lib/features/paywall/paywall_screen.dart

      - name: Analyze billing purchase service
        run: dart analyze lib/core/services/purchase_service.dart

      - name: Analyze billing mock service
        run: dart analyze lib/core/services/mock_purchase_service.dart

      - name: Analyze billing user repository
        run: dart analyze lib/repositories/user_repository.dart

      - name: Analyze billing paywall
        run: dart analyze lib/features/paywall/paywall_screen.dart
