name: Restaurant Menu Scroll Targeted QA

on:
  pull_request:
    paths:
      - 'test/restaurant_detail_menu_scroll_regression_test.dart'
      - 'lib/features/restaurant/**'
      - '.github/workflows/restaurant-menu-scroll-targeted.yml'

permissions:
  contents: read

jobs:
  menu-scroll-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Menu vertical-scroll regression
        run: flutter test test/restaurant_detail_menu_scroll_regression_test.dart

      - name: Run Restaurant Detail tab contract
        run: flutter test test/restaurant_detail_tabs_test.dart

      - name: Build QA debug APK with the required flavor
        run: flutter build apk --debug --flavor qa

      - name: Verify QA APK output
        run: |
          test -f build/app/outputs/flutter-apk/app-qa-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-qa-debug.apk

      - name: Upload QA debug APK proof
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-menu-scroll-qa-debug
          path: build/app/outputs/flutter-apk/app-qa-debug.apk
          if-no-files-found: error
          retention-days: 3
